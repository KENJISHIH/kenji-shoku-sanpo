      淋奶香醬汁、撒上糖漬核桃,甜鹹交錯。麵食有青島炒麵,粗油麵鋪滿牛肉、蝦仁與雞肉;
      炒碼湯麵紅湯辛香,整根乾辣椒、木耳與海鮮下得大方;餛飩湯清爽,附蘑菇片與青江菜。

      菜單上兩個名字值得說一下。「涼張皮」就是「兩張皮」,韓式中華、魯菜(山東菜)系的
      經典涼盤,韓文寫作 양장피(yangjangpi),英文菜單常直譯成 Double Skin Dish;
      「皮」指的是綠豆或地瓜澱粉做成的薄粉皮,配料全部切成細絲繞著盤子擺開,
      淋上黃芥末醬才拌,是道考刀工的宴客菜,一說菜名來自師傅喊「拉皮兩張」的口令。
      「炒碼」則是山東話,「碼」等於「料」,炒碼就是炒什錦——多種配料一起大火炒過再做成麵,
      所以炒碼湯麵其實就是什錦料湯麵;這道魯菜傳到朝鮮半島後,日治時期的日本人見它湯頭
      發白,拿日本流行的閩菜變種「強棒麵(ちゃんぽん)」稱呼它,韓語音譯成 짬뽕(jjamppong),
      1960 年代起加重辣椒粉與辣油,才長成今天這碗紅湯。

      適合家庭聚餐、想吃北方麵食與大份量合菜的午、晚餐。
    dishes:
      - "肉絲涼張皮(Shredded Pork & Veg with Bean Sheet)"
      - "核桃蝦(Honey Walnut Prawns)"
      - "炒碼湯麵(Jam Pong Noodle)"
